[package]
name = "notch-isla"
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/UtilityForCoders/notch-isla"
description = "Isla dinámica minimalista para Windows, enfocada en controlar la música."

[dependencies]
# Rasterizador 2D en Rust puro (anti-aliasing, curvas). Sin soporte PNG para mantenerlo liviano.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# Vector2 para Direct2D (ya viene con `windows`; aquí solo se nombra el tipo).
windows-numerics = "0.3"
# El macro `implement` (avisos de volumen y de salida de audio) genera código que la nombra.
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    # SMTC: la música que suena en cualquier app (Spotify, navegador...).
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    # Carátula: abrir la miniatura y decodificarla (JPEG/PNG) con WIC.
    "Graphics_Imaging",
    "Storage_Streams",
    # Texto: DirectWrite dibujado con Direct2D sobre el mismo DIB.
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_LibraryLoader",
    # Bandeja, instancia única e inicio con Windows.
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    # Volumen con la rueda del mouse (Core Audio).
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # Ícono de la app que suena: buscar su proceso y su .exe.
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Variant",
    # Actualizaciones: consulta el último release en GitHub, descarga y verifica el instalador.
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    # Sonido de "se acabó el tiempo" del temporizador (MessageBeep).
    "Win32_System_Diagnostics_Debug",
    # Aviso de salida de audio: nombre del dispositivo.
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
