# Dependabot propone por pull request las versiones nuevas de las dependencias de Rust y de las
# acciones del workflow (que van fijadas a un commit exacto). Cada propuesta pasa por la misma
# revisión que cualquier otro cambio.
#
# Revisa una vez al mes y agrupa para no llenar de PRs: todas las acciones van en uno solo, y la
# familia `windows*` también, porque sus crates tienen que estar en la misma versión (subir solo
# uno rompe la compilación). Las actualizaciones de seguridad no esperan al mes: llegan apenas
# se publica el aviso.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      windows:
        patterns:
          - "windows*"
    # Microsoft publicó la 0.100 de los crates pequeños pero todavía no la de `windows`, que
    # necesita `windows-core` 0.62: mezclarlos no compila. `windows` no se ignora, así que cuando
    # salga su 0.100 llega el PR que avisa que es hora de migrar (y de quitar esta regla).
    ignore:
      - dependency-name: "windows-core"
        versions: [">= 0.100"]
      - dependency-name: "windows-numerics"
        versions: [">= 0.100"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      acciones:
        patterns:
          - "*"
