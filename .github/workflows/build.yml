# Compila notch-isla.exe y el instalador en GitHub Actions.
#
# Firma de código con SignPath Foundation: los pasos de firma solo corren cuando el repo
# tiene configurada la variable SIGNPATH_ORGANIZATION_ID y el secreto SIGNPATH_API_TOKEN
# (Settings > Secrets and variables > Actions). Sin ellos, se publican los archivos sin firmar.
#
# Las acciones van fijadas al commit exacto (con su versión en el comentario): si alguien
# moviera la etiqueta "v4" de una acción a código malicioso, este workflow no lo usaría.
# Dependabot (.github/dependabot.yml) propone las actualizaciones.
#
# Orden: se firma primero el .exe y recién después se arma el instalador con ese .exe, así la
# app instalada también queda firmada. Luego se firma el instalador.

name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Nunca se firma el código de un pull request: solo lo que ya está en main o en una
      # etiqueta de versión (que solo puede crear el dueño del repo).
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token de GitHub no queda guardado en la copia para los pasos siguientes.
          persist-credentials: false

      - name: Caché de Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Compilar la app
        run: cargo build --release

      - name: Subir el .exe sin firmar
        id: unsigned-exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notch-isla-exe-sin-firmar
          path: target/release/notch-isla.exe

      - name: Firmar el .exe (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: notch-isla
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Usar el .exe firmado
        if: env.SIGNING == 'true'
        shell: pwsh
        run: Copy-Item signed-exe/notch-isla.exe target/release/notch-isla.exe -Force

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Armar el instalador
        shell: pwsh
        run: ./installer/build.ps1 -SkipCargo

      - name: Subir el instalador sin firmar
        id: unsigned-setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notch-isla-setup-sin-firmar
          path: target/installer/*.exe

      - name: Firmar el instalador (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: notch-isla
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Reunir los archivos finales
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/notch-isla.exe dist/
          if ($env:SIGNING -eq 'true') {
            Copy-Item signed-setup/*.exe dist/
          } else {
            Copy-Item target/installer/*.exe dist/
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Subir los archivos finales
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notch-isla-${{ github.sha }}
          path: dist/*.exe
