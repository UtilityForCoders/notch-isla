# Compila notch-isla.exe y el instalador en GitHub Actions y, en main, publica el release.
#
# Flujo (Git Flow, ver CLAUDE.md):
# - Pull requests: se revisa que la rama vaya al destino correcto y que el título siga
#   Conventional Commits. Hacia main, además, que la versión de Cargo.toml no esté publicada.
# - develop y pull requests: se compila y se prueba, sin firmar ni publicar.
# - main: se compila, se firma (si está configurado) y, si la versión de Cargo.toml todavía no
#   tiene etiqueta, se crea la etiqueta vX.Y.Z y el release con los dos archivos.
#
# Firma de código con SignPath Foundation: los pasos de firma solo corren cuando el repo
# tiene configurada la variable SIGNPATH_ORGANIZATION_ID y el secreto SIGNPATH_API_TOKEN
# (Settings > Secrets and variables > Actions). Sin ellos, se publican los archivos sin firmar.
#
# Las acciones van fijadas al commit exacto (con su versión en el comentario): si alguien
# moviera la etiqueta "v4" de una acción a código malicioso, este workflow no lo usaría.
# Dependabot (.github/dependabot.yml) propone las actualizaciones.
#
# Orden: se firma primero el .exe y recién después se arma el instalador con ese .exe, así la
# app instalada también queda firmada. Luego se firma el instalador.

name: Compilar

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un PR nuevo cancela la compilación anterior del mismo PR. En main y develop no se cancela
# nada: cada commit de main puede ser una versión.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reglas de Git Flow y Conventional Commits para los pull requests.
  politica:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Hacen falta las etiquetas para saber qué versiones ya se publicaron.
          fetch-depth: 0

      - name: Rama de origen y destino
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            main)
              [[ $HEAD_REF =~ ^(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
                echo "::error::A main solo entran release/x.y.z y hotfix/x.y.z (esta rama: $HEAD_REF)."
                exit 1
              } ;;
            develop)
              [[ $HEAD_REF =~ ^(feature|release|hotfix|dependabot)/ ]] || {
                echo "::error::A develop entran feature/*, release/*, hotfix/* y dependabot/* (esta rama: $HEAD_REF)."
                exit 1
              } ;;
            *)
              echo "::error::Los pull requests van a develop o a main, no a $BASE_REF."
              exit 1 ;;
          esac

      - name: Título en formato Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          [[ $TITLE =~ $pattern ]] || {
            echo "::error::El título \"$TITLE\" no sigue Conventional Commits (ej.: \"fix(media): no perder la carátula\")."
            exit 1
          }

      - name: Versión nueva hacia main
        if: github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::La versión $version ya está publicada: súbela en Cargo.toml."
            exit 1
          fi
          if [[ ${HEAD_REF#*/} != "$version" ]]; then
            echo "::error::La rama $HEAD_REF no coincide con la versión de Cargo.toml ($version)."
            exit 1
          fi

  build:
    runs-on: windows-latest
    env:
      # Solo se firma lo que llega a main (que solo puede recibir PRs revisados). Nunca el
      # código de un pull request.
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El token de GitHub no queda guardado en la copia para los pasos siguientes.
          persist-credentials: false

      - name: Caché de Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test --release

      - name: Compilar la app
        run: cargo build --release

      - name: Subir el .exe sin firmar
        id: unsigned-exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notch-isla-exe-sin-firmar
          path: target/release/notch-isla.exe

      - name: Firmar el .exe (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: notch-isla
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      - name: Usar el .exe firmado
        if: env.SIGNING == 'true'
        shell: pwsh
        run: Copy-Item signed-exe/notch-isla.exe target/release/notch-isla.exe -Force

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Armar el instalador
        shell: pwsh
        run: ./installer/build.ps1 -SkipCargo

      - name: Subir el instalador sin firmar
        id: unsigned-setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notch-isla-setup-sin-firmar
          path: target/installer/*.exe

      - name: Firmar el instalador (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: notch-isla
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Reunir los archivos finales
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/notch-isla.exe dist/
          if ($env:SIGNING -eq 'true') {
            Copy-Item signed-setup/*.exe dist/
          } else {
            Copy-Item target/installer/*.exe dist/
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Subir los archivos finales
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notch-isla-${{ github.sha }}
          path: dist/*.exe

    outputs:
      signed: ${{ env.SIGNING }}

  # Publica la versión de Cargo.toml si todavía no tiene release. Solo en main y solo si la
  # compilación terminó bien.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Toda la historia y las etiquetas: las notas se arman con los commits desde la
          # versión anterior.
          fetch-depth: 0

      - name: Versión a publicar
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1 \
            || git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "La versión $version ya está publicada: no hay nada que hacer."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar los archivos compilados
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notch-isla-${{ github.sha }}
          path: dist

      - name: Comprobar los archivos
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # El actualizador de la app busca el instalador exactamente con este nombre.
          for file in "dist/notch-isla-setup-$VERSION.exe" dist/notch-isla.exe; do
            [[ -s $file ]] || { echo "::error::Falta $file"; exit 1; }
          done
          ls -l dist

      - name: Armar las notas
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FIRMADO: ${{ needs.build.outputs.signed }}
        run: |
          bash .github/scripts/notas-release.sh "$VERSION" > notas.md
          cat notas.md

      - name: Publicar el release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Crea la etiqueta vX.Y.Z en este commit junto con el release.
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Notch Isla $VERSION" \
            --notes-file notas.md \
            --latest \
            "dist/notch-isla-setup-$VERSION.exe" \
            dist/notch-isla.exe
